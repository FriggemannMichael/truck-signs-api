services:
  db:
    image: postgres:16-alpine
    container_name: tsa_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    networks:
      - tsa-network
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER} -d ${DB_NAME}']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: truck-signs-api:latest
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_PORT: ${APP_PORT:-8020}
    container_name: tsa_backend
    restart: unless-stopped
    env_file: .env
    environment:
      MODE: prod
      DEBUG_ENABLED: 'False'
      DB_HOST: db
      DB_PORT: 5432
    ports:
      - '${APP_PORT:-8020}:${APP_PORT:-8020}'
    networks:
      - tsa-network
    volumes:
      - static_data:/app/src/staticfiles
      - media_data:/app/src/media
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  static_data:
  media_data:

networks:
  tsa-network:
    driver: bridge
