name: Lint and Test Python Code Base

on:
    push:
        branches: ["main"]
        paths:
            - "**/*.py"
            - "pyproject.toml"
            - "uv.lock"
    pull_request:
        branches: ["main"]
        paths:
            - "**/*.py"
            - "pyproject.toml"
            - "uv.lock"

permissions:
    contents: read
    pull-requests: write

jobs:
    lint:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5
            - name: Install uv
              uses: astral-sh/setup-uv@v6
              with:
                  enable-cache: true
            - name: Install Dependencies
              run: uv sync --frozen
            - name: Lint and Check Formatting
              run: |
                  uv run ruff check .
                  uv run ruff format --check .

    test:
        runs-on: ubuntu-latest
        needs: lint
        env:
            MODE: dev
        steps:
            - uses: actions/checkout@v5
            - name: Install uv
              uses: astral-sh/setup-uv@v6
              with:
                  enable-cache: true
            - name: Install Dependencies
              run: uv sync --frozen
            - name: Run Django Tests
              working-directory: src
              run: |
                  uv run python manage.py test --verbosity=2
