[project]
name = "truck-signs-api"
version = "0.1.0"
description = "Truck Signs API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cloudinary==1.47.0",
    "django==6.1.3",
    "django-cors-headers==4.9.0",
    "djangorestframework==3.18.3",
    "gunicorn==27.0.1",
    "pillow==13.0.0",
    "psycopg2-binary==2.9.13",
    "python-dotenv==1.2.4",
    "whitenoise==6.12.0",
]

[dependency-groups]
dev = [
    "ruff==0.17.6",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
extend-ignore = ["E203"]
