[project]
name = "truck-signs-api"
version = "0.1.0"
description = "Truck Signs API"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "cloudinary==1.44.1",
    "django==5.2.8",
    "django-cors-headers==4.9.0",
    "djangorestframework==3.16.1",
    "gunicorn==23.0.0",
    "pillow==12.0.0",
    "psycopg2-binary==2.9.11",
    "python-dotenv==1.0.1",
    "whitenoise==6.8.2",
]

[dependency-groups]
dev = ["ruff"]

[tool.uv]
package = false

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["migrations"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
extend-ignore = ["E203"]
